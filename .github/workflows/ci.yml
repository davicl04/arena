name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://arena:arena@localhost:5432/arena
      TEST_DATABASE_URL: postgresql+psycopg2://arena:arena@localhost:5432/arena
      MEDIA_TEST_S3: '1'
      MEDIA_S3_ENDPOINT: http://localhost:9000
      MEDIA_S3_ACCESS_KEY: arena-local
      MEDIA_S3_SECRET_KEY: arena-local-password-change-me
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - name: Start isolated MinIO
        run: docker compose -f ../docker-compose.yml up -d --build --wait minio
      - run: python -m app.media_admin ensure-bucket
      - run: ruff check app migrations tests
      - run: alembic upgrade head
      - run: alembic check
      - name: Unit tests and coverage
        run: pytest tests/unit -q --cov=app --cov-branch --cov-fail-under=60 --cov-report=xml:../artifacts/coverage/backend/unit.xml --cov-report=html:../artifacts/coverage/backend/unit-html --junitxml=../artifacts/coverage/backend/unit-tests.xml
      - name: Unit and PostgreSQL integration tests
        run: pytest -q --cov=app --cov-branch --cov-fail-under=85 --cov-report=xml:../artifacts/coverage/backend/full.xml --cov-report=html:../artifacts/coverage/backend/full-html --junitxml=../artifacts/coverage/backend/full-tests.xml
      - name: Publish quality summary
        if: always()
        run: python ../scripts/quality_summary.py backend ../artifacts/coverage/backend >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: artifacts/coverage/backend/
          if-no-files-found: error
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish quality summary
        if: always()
        run: python ../scripts/quality_summary.py ${{ matrix.client }} ../artifacts/coverage/${{ matrix.client }} >> "$GITHUB_STEP_SUMMARY"
      - name: Upload client test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.client }}
          path: artifacts/coverage/${{ matrix.client }}/
          if-no-files-found: error
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npm run export:android
