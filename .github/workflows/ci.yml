name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://arena:arena@localhost:5432/arena
      TEST_DATABASE_URL: postgresql+psycopg2://arena:arena@localhost:5432/arena
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: ruff check app migrations tests
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - if: matrix.client == 'web'
        run: npm run build
      - if: matrix.client == 'mobile'
        run: npm run export:android
